<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgAuto" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#142634" />
    </linearGradient>
    <linearGradient id="glowBot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <rect width="600" height="380" rx="16" fill="url(#bgAuto)" />

  <!-- App Header -->
  <rect x="30" y="25" width="540" height="42" rx="10" fill="#1e293b" />
  <circle cx="55" cy="46" r="10" fill="url(#glowBot)" />
  <text x="50" y="50" fill="#ffffff" font-size="10">🤖</text>
  <text x="75" y="51" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="13">Auto Content Multi-Platform Publisher &amp; Sales Bot</text>
  <rect x="440" y="35" width="115" height="22" rx="6" fill="#38bdf8" opacity="0.2" />
  <text x="450" y="50" fill="#38bdf8" font-family="sans-serif" font-size="10">● Python Bot Active</text>

  <!-- Left: Python Terminal / Script Runner -->
  <g transform="translate(30, 80)">
    <rect width="250" height="270" rx="12" fill="#090d16" stroke="#334155" stroke-width="1.5" />
    <rect width="250" height="30" rx="12" fill="#1e293b" />
    <circle cx="20" cy="15" r="4" fill="#ef4444" />
    <circle cx="32" cy="15" r="4" fill="#f59e0b" />
    <circle cx="44" cy="15" r="4" fill="#10b981" />
    <text x="60" y="19" fill="#94a3b8" font-family="monospace" font-size="10">publisher_bot.py</text>

    <!-- Terminal Code -->
    <text x="15" y="55" fill="#38bdf8" font-family="monospace" font-size="10">&gt; python scheduler.py --run</text>
    <text x="15" y="80" fill="#10b981" font-family="monospace" font-size="10">[✓] Gemini AI copy generated</text>
    <text x="15" y="105" fill="#e2e8f0" font-family="monospace" font-size="10">[✓] Rendering Shorts video</text>
    <text x="15" y="130" fill="#f59e0b" font-family="monospace" font-size="10">[⏳] Queueing Multi-Upload:</text>
    <text x="25" y="150" fill="#cbd5e1" font-family="monospace" font-size="9">● YouTube Shorts: PUBLISHED</text>
    <text x="25" y="170" fill="#cbd5e1" font-family="monospace" font-size="9">● Threads Post: PUBLISHED</text>
    <text x="25" y="190" fill="#cbd5e1" font-family="monospace" font-size="9">● Sales Link Tracked: ACTIVE</text>
    <text x="15" y="225" fill="#10b981" font-family="monospace" font-size="10">[✓] 100% Pipeline Complete!</text>
    
    <rect x="15" y="240" width="220" height="20" rx="4" fill="#1e293b" />
    <text x="25" y="254" fill="#38bdf8" font-family="monospace" font-size="9">Next Run: Today at 20:00 WIB</text>
  </g>

  <!-- Right: Social Channels Distribution Map -->
  <g transform="translate(300, 80)">
    <rect width="270" height="270" rx="12" fill="#131e36" stroke="#334155" stroke-width="1" />
    <text x="20" y="30" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="12">Multi-Channel Distribution</text>

    <!-- Channel 1: YouTube Shorts -->
    <rect x="20" y="45" width="230" height="60" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="1" />
    <circle cx="45" cy="75" r="14" fill="#ef4444" />
    <text x="40" y="79" fill="#ffffff" font-size="12">▶</text>
    <text x="70" y="68" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="11">YouTube Shorts</text>
    <text x="70" y="85" fill="#10b981" font-family="sans-serif" font-size="9">Otomasi Jadwal &amp; Tag SEO</text>

    <!-- Channel 2: Threads / Meta -->
    <rect x="20" y="115" width="230" height="60" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <circle cx="45" cy="145" r="14" fill="#000000" />
    <text x="40" y="149" fill="#ffffff" font-size="12">@</text>
    <text x="70" y="138" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="11">Threads by Meta</text>
    <text x="70" y="155" fill="#38bdf8" font-family="sans-serif" font-size="9">Copywriting &amp; Lead Funnel</text>

    <!-- Channel 3: Sales Link Tracking -->
    <rect x="20" y="185" width="230" height="65" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1" />
    <circle cx="45" cy="217" r="14" fill="#10b981" />
    <text x="40" y="221" fill="#ffffff" font-size="12">💰</text>
    <text x="70" y="208" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="11">Sales Bot &amp; Afiliasi</text>
    <text x="70" y="225" fill="#94a3b8" font-family="sans-serif" font-size="9">Tracking Klik &amp; Konversi Produk</text>
  </g>
</svg>
