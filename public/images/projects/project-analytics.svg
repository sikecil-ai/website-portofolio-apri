<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="chartGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="600" height="380" rx="16" fill="url(#bg1)" />
  
  <!-- Ambient Grid -->
  <g opacity="0.1" stroke="#94a3b8" stroke-width="1">
    <line x1="40" y1="80" x2="560" y2="80" />
    <line x1="40" y1="140" x2="560" y2="140" />
    <line x1="40" y1="200" x2="560" y2="200" />
    <line x1="40" y1="260" x2="560" y2="260" />
    <line x1="40" y1="320" x2="560" y2="320" />
  </g>

  <!-- Top Window Bar -->
  <rect x="40" y="30" width="520" height="35" rx="10" fill="#1e293b" opacity="0.8" />
  <circle cx="65" cy="47" r="5" fill="#ef4444" />
  <circle cx="82" cy="47" r="5" fill="#f59e0b" />
  <circle cx="99" cy="47" r="5" fill="#10b981" />
  <rect x="130" y="40" width="220" height="14" rx="4" fill="#334155" />
  <rect x="480" y="38" width="60" height="18" rx="6" fill="#6366f1" />

  <!-- Metric Cards -->
  <rect x="40" y="80" width="160" height="70" rx="10" fill="#1e293b" opacity="0.7" stroke="#334155" stroke-width="1" />
  <text x="55" y="105" fill="#94a3b8" font-family="sans-serif" font-size="12">Total Revenue</text>
  <text x="55" y="133" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="20">$128,450</text>
  <text x="145" y="133" fill="#10b981" font-family="sans-serif" font-size="11">+24%</text>

  <rect x="220" y="80" width="160" height="70" rx="10" fill="#1e293b" opacity="0.7" stroke="#334155" stroke-width="1" />
  <text x="235" y="105" fill="#94a3b8" font-family="sans-serif" font-size="12">Active Sessions</text>
  <text x="235" y="133" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="20">14,290</text>
  <text x="325" y="133" fill="#10b981" font-family="sans-serif" font-size="11">+18%</text>

  <rect x="400" y="80" width="160" height="70" rx="10" fill="#1e293b" opacity="0.7" stroke="#334155" stroke-width="1" />
  <text x="415" y="105" fill="#94a3b8" font-family="sans-serif" font-size="12">API Uptime</text>
  <text x="415" y="133" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="20">99.98%</text>
  <text x="515" y="133" fill="#38bdf8" font-family="sans-serif" font-size="11">Fast</text>

  <!-- Big Graph Section -->
  <rect x="40" y="165" width="520" height="175" rx="12" fill="#131e36" stroke="#1e293b" stroke-width="1" />
  
  <!-- Area fill under line -->
  <path d="M60 300 Q120 270, 180 230 T300 240 T420 190 T520 200 L520 320 L60 320 Z" fill="url(#chartGlow)" />
  
  <!-- Glowing Chart Line -->
  <path d="M60 300 Q120 270, 180 230 T300 240 T420 190 T520 200" fill="none" stroke="url(#lineGrad)" stroke-width="4" stroke-linecap="round" />

  <!-- Data point badges -->
  <circle cx="180" cy="230" r="5" fill="#38bdf8" stroke="#0f172a" stroke-width="2" />
  <circle cx="300" cy="240" r="5" fill="#6366f1" stroke="#0f172a" stroke-width="2" />
  <circle cx="420" cy="190" r="6" fill="#ec4899" stroke="#0f172a" stroke-width="2" />
  <circle cx="520" cy="200" r="5" fill="#10b981" stroke="#0f172a" stroke-width="2" />
</svg>
