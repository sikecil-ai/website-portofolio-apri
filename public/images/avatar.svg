<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="avatarGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbcfe8" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="300" height="300" rx="150" fill="url(#bgGrad)" />
  <circle cx="150" cy="150" r="145" stroke="url(#avatarGlow)" stroke-width="4" fill="none" opacity="0.8" />
  <circle cx="150" cy="100" r="80" fill="#6366f1" opacity="0.15" filter="url(#glow)" />
  
  <!-- Developer Avatar illustration -->
  <g transform="translate(0, 10)">
    <!-- Shoulders / Hoodie -->
    <path d="M70 260 C70 200, 100 185, 150 185 C200 185, 230 200, 230 260 Z" fill="#1e293b" />
    <path d="M90 260 C90 215, 115 200, 150 200 C185 200, 210 215, 210 260 Z" fill="#334155" />
    <!-- Neck -->
    <rect x="135" y="150" width="30" height="30" rx="6" fill="#fcd34d" opacity="0.9" />
    <!-- Head -->
    <ellipse cx="150" cy="120" rx="42" ry="48" fill="#fde68a" />
    <!-- Hair -->
    <path d="M108 115 C105 80, 125 65, 150 65 C175 65, 195 80, 192 115 C185 85, 160 80, 150 82 C135 80, 115 85, 108 115 Z" fill="#0f172a" />
    <!-- Glasses -->
    <rect x="118" y="112" width="26" height="18" rx="6" fill="none" stroke="#6366f1" stroke-width="3" />
    <rect x="156" y="112" width="26" height="18" rx="6" fill="none" stroke="#6366f1" stroke-width="3" />
    <line x1="144" y1="120" x2="156" y2="120" stroke="#6366f1" stroke-width="3" />
    <!-- Smile -->
    <path d="M140 142 Q150 150 160 142" stroke="#475569" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <!-- Laptop / Tech Code Symbol -->
    <rect x="100" y="235" width="100" height="40" rx="8" fill="#0f172a" stroke="#475569" stroke-width="2" />
    <polygon points="140,248 135,255 140,262" fill="#38bdf8" />
    <polygon points="160,248 165,255 160,262" fill="#38bdf8" />
    <line x1="148" y1="262" x2="152" y2="248" stroke="#a855f7" stroke-width="2" />
  </g>
</svg>
